name: Fork build
# Manual build of the MangaBaka covers fork, signed with your own key.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (no telemetry, no updater)
        run: ./gradlew assembleRelease

      - name: Sign universal APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/fork.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/app-universal-release-unsigned.apk)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/fork.jks" --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out Komikku-mangabaka.apk "$APK"
          "$APKSIGNER" verify Komikku-mangabaka.apk
          rm -f "$RUNNER_TEMP/fork.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Komikku-mangabaka
          path: Komikku-mangabaka.apk
          retention-days: 14
